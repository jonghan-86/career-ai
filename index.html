<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>진로 · 전공 탐색 AI 도우미</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>진로 · 전공 탐색 AI 도우미</h1>
    <p class="subtitle">대학교 전공, 교과목, 관련 직업 정보를 한 번에 검색해 보세요.</p>
  </header>

  <main class="app-main">
    <section class="search-panel card">
      <h2>검색 조건</h2>
      <div class="field-group">
        <label for="keyword">키워드 (전공명 / 교과목 / 관련 직업 등)</label>
        <input id="keyword" type="search" placeholder="예: AI, 간호, 빅데이터, 디자인, 프로그래밍">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="region">지역</label>
          <select id="region">
            <option value="">전체</option>
          </select>
        </div>

        <div class="field-group">
          <label for="degree">학위 과정</label>
          <select id="degree">
            <option value="">전체</option>
          </select>
        </div>

        <div class="field-group">
          <label for="category">계열</label>
          <select id="category">
            <option value="">전체</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="searchBtn">검색하기</button>
        <button id="resetBtn" class="ghost">초기화</button>
      </div>

      <p id="status" class="status">데이터 로딩 중...</p>
    </section>

    <section class="summary-panel card">
      <h2>검색 요약</h2>
      <div id="summary">
        <p>아직 검색 전입니다. 조건을 선택하고 <strong>검색하기</strong> 버튼을 눌러주세요.</p>
      </div>
    </section>

    <section class="results-panel card">
      <h2>전공 결과 <span id="resultCount" class="badge">0</span></h2>
      <div id="results" class="results-list">
        <!-- 검색 결과가 여기에 표시됩니다. -->
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>데이터 기준: 한국대학교육협의회 대학알리미 공개자료.</p>
    <p>GitHub Pages + PWA(오프라인 지원) 테스트용 버전입니다.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
